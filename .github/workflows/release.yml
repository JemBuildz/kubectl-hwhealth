name: Test and Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.x'
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries and checksums
        env:
          LICENSE_PUBKEY_HEX: ${{ vars.HWHEALTH_ED25519_PUBKEY_HEX }}
        run: |
          set -euo pipefail
          if [[ -n "$LICENSE_PUBKEY_HEX" && ! "$LICENSE_PUBKEY_HEX" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "HWHEALTH_ED25519_PUBKEY_HEX must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" && -z "$LICENSE_PUBKEY_HEX" ]]; then
            echo "Set the public repository variable HWHEALTH_ED25519_PUBKEY_HEX before publishing a release" >&2
            exit 1
          fi

          mkdir -p dist
          ldflags='-s -w'
          if [[ -n "$LICENSE_PUBKEY_HEX" ]]; then
            ldflags="$ldflags -X main.ed25519PubKeyHex=$LICENSE_PUBKEY_HEX"
          fi
          GOOS=linux GOARCH=amd64 go build -ldflags="$ldflags" -o dist/kubectl-hwhealth-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$ldflags" -o dist/kubectl-hwhealth-linux-arm64 .
          (cd dist && sha256sum kubectl-hwhealth-* > checksums.txt)

      - name: Upload release assets for the isolated publisher job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download built assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Attest release binaries and checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release-assets/kubectl-hwhealth-*
            release-assets/checksums.txt

      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
